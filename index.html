<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#78886e"><link rel="manifest" href="manifest.webmanifest"><title>Yu Su Kreativstudio 记账</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>
:root{--bg:#f5f2eb;--card:#fffdf9;--text:#30342e;--muted:#777b73;--line:#ddd8cd;--accent:#78886e;--soft:#e9eee5;--warn:#f5e8b9;--bad:#f7e5e4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif}.app{max-width:900px;margin:auto;padding:14px 12px 40px}h1{font-size:23px;margin:5px 0}.sub,.mini{font-size:12px;color:var(--muted)}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}.tab,button,input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px;color:var(--text)}button{font-weight:650}.tab.active,.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.page{display:none}.page.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.quick,.stats,.grid,.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px}.big{padding:17px;font-size:17px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px}.stat span{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:20px;margin-top:3px}.full{grid-column:1/-1}label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px 2px}textarea{min-height:68px;resize:vertical}.actions{display:flex;gap:8px;margin-top:10px}.actions>*{flex:1}.secondary{background:var(--soft)}.danger{color:#a5524d;background:#fff}.list{display:flex;flex-direction:column;gap:9px}.item{background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px}.top{display:flex;justify-content:space-between;gap:10px}.amt{font-size:18px;font-weight:750}.badge{display:inline-block;padding:2px 7px;border-radius:999px;background:var(--soft);font-size:12px;margin:3px 3px 0 0}.warn{background:var(--warn)}.bad{background:var(--bad)}.meta{font-size:12px;color:var(--muted);line-height:1.6;margin-top:5px}.empty{text-align:center;color:var(--muted);padding:28px}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#30342e;color:#fff;padding:10px 14px;border-radius:999px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:560px){.grid,.filters{grid-template-columns:1fr}.full{grid-column:auto}.tab{font-size:12px;padding:9px 2px}}
</style></head><body><div class="app"><h1>Yu Su Kreativstudio</h1><div class="sub">记账 · 查询 · 统计 · Excel导出 · 本机保存</div>
<nav class="tabs"><button class="tab active" data-p="home">首页</button><button class="tab" data-p="book">账本</button><button class="tab" data-p="stats">统计</button><button class="tab" data-p="data">数据</button></nav>

<section id="home" class="page active"><div class="quick"><button class="big primary" onclick="startNew('Einnahme')">＋ 记收入</button><button class="big" onclick="startNew('Ausgabe')">－ 记支出</button></div><div class="card"><div class="stats"><div class="stat"><span>收入合计</span><b id="hIn">€0.00</b></div><div class="stat"><span>支出合计</span><b id="hOut">€0.00</b></div><div class="stat"><span>经营结余</span><b id="hBal">€0.00</b></div><div class="stat"><span>现金未存银行</span><b id="hCash">€0.00</b></div></div></div>
<div class="card" id="form"><div class="grid">
<div><label>Datum 日期</label><input id="date" type="date"></div><div><label>Art 类型</label><select id="art"><option>Einnahme</option><option>Ausgabe</option><option>Privateinlage</option><option>Privatentnahme</option><option>Umbuchung</option></select></div>
<div class="full"><label>Beschreibung 内容</label><input id="desc" placeholder="Geburtstag / 10er-Karte / Polymer Clay"></div><div><label>Betrag 金额 (€)</label><input id="amount" type="number" min="0" step="0.01"></div>
<div><label>Kategorie 分类</label><select id="category"></select></div><div><label>Plattform 平台</label><select id="platform"><option>Direkt / Workshop</option><option>Amazon</option><option>Taobao</option><option>Xingqudao</option><option>WeChat</option><option>Geschäft</option><option>Sonstiges</option></select></div>
<div><label>Zahlungsart 支付方式</label><select id="payment"><option>Bar</option><option>Bank</option><option>PayPal</option><option>WeChat</option><option>Sonstiges</option></select></div><div><label>Beleg 发票/凭证</label><select id="receipt"><option>—</option><option>gespeichert</option><option>fehlt</option></select></div>
<div><label>Bankstatus 现金是否存银行</label><select id="bank"><option>—</option><option>eingezahlt</option><option>noch nicht eingezahlt</option></select></div><div class="full"><label>Notiz 备注</label><textarea id="note"></textarea></div></div>
<div class="actions"><button class="primary" id="save">✓ 保存</button><button class="secondary" id="clear">清空输入</button></div></div></section>

<section id="book" class="page"><div class="card"><div class="filters"><input id="q" placeholder="搜索内容、平台、备注"><select id="fart"><option value="">全部类型</option><option>Einnahme</option><option>Ausgabe</option><option>Privateinlage</option><option>Privatentnahme</option><option>Umbuchung</option></select><select id="fcat"><option value="">全部分类</option></select><select id="fpay"><option value="">全部支付方式</option><option>Bar</option><option>Bank</option><option>PayPal</option><option>WeChat</option></select><select id="fbeleg"><option value="">全部凭证状态</option><option>gespeichert</option><option>fehlt</option><option>—</option></select><select id="fbank"><option value="">全部现金状态</option><option>eingezahlt</option><option>noch nicht eingezahlt</option><option>—</option></select><input id="from" type="date"><input id="to" type="date"></div><div class="actions"><button class="secondary" id="rf">清除筛选</button><button class="secondary" id="sort">日期：新 → 旧</button></div><div class="mini" id="fs" style="margin-top:8px"></div></div><div id="list" class="list"></div></section>

<section id="stats" class="page"><div class="card"><div class="grid"><div><label>年份</label><select id="year"></select></div><div><label>月份</label><select id="month"><option value="">全年</option><option value="01">1月</option><option value="02">2月</option><option value="03">3月</option><option value="04">4月</option><option value="05">5月</option><option value="06">6月</option><option value="07">7月</option><option value="08">8月</option><option value="09">9月</option><option value="10">10月</option><option value="11">11月</option><option value="12">12月</option></select></div></div><div class="stats" style="margin-top:10px"><div class="stat"><span>期间收入</span><b id="sIn">€0.00</b></div><div class="stat"><span>期间支出</span><b id="sOut">€0.00</b></div><div class="stat"><span>经营结余</span><b id="sBal">€0.00</b></div><div class="stat"><span>记录笔数</span><b id="sN">0</b></div></div></div><div class="card"><b>收入分类</b><div id="incCats"></div></div><div class="card"><b>支出分类</b><div id="outCats"></div></div></section>

<section id="data" class="page"><div class="card"><b>导出账本</b><div class="mini">Excel 为 .xlsx；CSV 也可直接用 Excel 打开。</div><div class="actions"><button class="primary" id="xlsx">导出 Excel</button><button class="secondary" id="csv">导出 CSV</button></div><div class="actions"><button class="secondary" id="json">备份 JSON</button><button class="secondary" onclick="window.print()">打印 / PDF</button></div></div><div class="card"><b>恢复备份</b><input id="imp" type="file" accept=".json" style="margin-top:9px"><button class="secondary" id="restore" style="margin-top:9px">导入 JSON</button></div><div class="card"><b>数据安全</b><div class="mini">数据保存在当前设备浏览器。清除 Safari 网站数据或换设备前，请先导出 Excel 或 JSON。</div><button class="danger" id="wipe" style="margin-top:9px">清空全部账本数据</button></div></section></div><div class="toast" id="toast"></div>
<script>
const KEY='yusu_book_v4',cats=['Workshop-Einnahmen','Geburtstag','10er-Karte','Erstbesuch','Material','Weiterbildung / Kurs','Werkzeug / Ausstattung','Werbung / Marketing','Software / Abos','Fahrt / Veranstaltung','Privateinlage','Privatentnahme','Umbuchung','Sonstiges'];let items=[],editing=null,descSort=true;const $=x=>document.getElementById(x),today=new Date().toISOString().slice(0,10);
function load(){try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}}function saveStore(){localStorage.setItem(KEY,JSON.stringify(items))}function euro(n){return new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n||0)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)}
function page(p){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===p));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.p===p));if(p==='book')renderBook();if(p==='stats')renderStats()}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>page(t.dataset.p));
function reset(){editing=null;$('date').value=today;$('art').value='Einnahme';$('desc').value='';$('amount').value='';$('category').value='Workshop-Einnahmen';$('platform').value='Direkt / Workshop';$('payment').value='Bar';$('receipt').value='—';$('bank').value='—';$('note').value='';$('save').textContent='✓ 保存'}
function startNew(a){page('home');reset();$('art').value=a;if(a==='Ausgabe'){$('category').value='Material';$('platform').value='Amazon';$('payment').value='Bank'}$('form').scrollIntoView({behavior:'smooth'})}
function rec(){return{id:editing||Date.now().toString(36)+Math.random().toString(36).slice(2,7),date:$('date').value,art:$('art').value,desc:$('desc').value.trim(),amount:Number($('amount').value),category:$('category').value,platform:$('platform').value,payment:$('payment').value,receipt:$('receipt').value,bank:$('bank').value,note:$('note').value.trim(),updatedAt:new Date().toISOString()}}
$('save').onclick=()=>{let x=rec();if(!x.date||!x.desc||!(x.amount>0))return alert('请填写日期、内容和大于0的金额。');if(editing){let i=items.findIndex(v=>v.id===editing);if(i>=0)items[i]=x}else items.push(x);saveStore();reset();renderAll();toast('已保存 ✓')};$('clear').onclick=()=>{reset();toast('已清空')};
function calc(a){let i=a.filter(x=>x.art==='Einnahme').reduce((s,x)=>s+x.amount,0),o=a.filter(x=>x.art==='Ausgabe').reduce((s,x)=>s+x.amount,0);return{i,o,b:i-o}}function renderHome(){let c=calc(items),cash=items.filter(x=>x.art==='Einnahme'&&x.payment==='Bar'&&x.bank==='noch nicht eingezahlt').reduce((s,x)=>s+x.amount,0);$('hIn').textContent=euro(c.i);$('hOut').textContent=euro(c.o);$('hBal').textContent=euro(c.b);$('hCash').textContent=euro(cash)}
function filtered(){let q=$('q').value.toLowerCase(),a=$('fart').value,c=$('fcat').value,p=$('fpay').value,r=$('fbeleg').value,b=$('fbank').value,f=$('from').value,t=$('to').value;return items.filter(x=>(!q||[x.desc,x.category,x.platform,x.payment,x.note].join(' ').toLowerCase().includes(q))&&(!a||x.art===a)&&(!c||x.category===c)&&(!p||x.payment===p)&&(!r||x.receipt===r)&&(!b||x.bank===b)&&(!f||x.date>=f)&&(!t||x.date<=t)).sort((x,y)=>descSort?y.date.localeCompare(x.date):x.date.localeCompare(y.date))}
function renderBook(){let a=filtered(),c=calc(a);$('fs').textContent=`${a.length} 笔 · 收入 ${euro(c.i)} · 支出 ${euro(c.o)} · 结余 ${euro(c.b)}`;$('list').innerHTML=a.length?a.map(x=>`<div class="item"><div class="top"><div><b>${esc(x.desc)}</b><div class="mini">${x.date}</div></div><div class="amt">${x.art==='Ausgabe'?'- ':''}${euro(x.amount)}</div></div><div class="meta"><span class="badge">${x.art}</span><span class="badge">${esc(x.category)}</span><span class="badge">${esc(x.platform)}</span><span class="badge">${x.payment}</span>${x.receipt==='fehlt'?'<span class="badge bad">Beleg fehlt</span>':''}${x.receipt==='gespeichert'?'<span class="badge">Beleg ✓</span>':''}${x.bank==='noch nicht eingezahlt'?'<span class="badge warn">noch nicht eingezahlt</span>':''}${x.note?'<br>'+esc(x.note):''}</div><div class="actions"><button class="secondary" onclick="edit('${x.id}')">编辑</button><button class="danger" onclick="del('${x.id}')">删除</button></div></div>`).join(''):'<div class="empty">没有符合条件的记录</div>'}
window.edit=id=>{let x=items.find(v=>v.id===id);if(!x)return;editing=id;page('home');['date','art','desc','amount','category','platform','payment','receipt','bank','note'].forEach(k=>$(k).value=x[k]??'');$('save').textContent='✓ 保存修改';$('form').scrollIntoView({behavior:'smooth'})};window.del=id=>{if(confirm('确定删除这条记录吗？')){items=items.filter(x=>x.id!==id);saveStore();renderAll();toast('已删除')}};['q','fart','fcat','fpay','fbeleg','fbank','from','to'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',renderBook));$('rf').onclick=()=>{['q','fart','fcat','fpay','fbeleg','fbank','from','to'].forEach(id=>$(id).value='');renderBook()};$('sort').onclick=()=>{descSort=!descSort;$('sort').textContent=descSort?'日期：新 → 旧':'日期：旧 → 新';renderBook()};
function years(){let ys=[...new Set(items.map(x=>x.date.slice(0,4)))].sort().reverse(),cur=String(new Date().getFullYear());if(!ys.includes(cur))ys.unshift(cur);let old=$('year').value;$('year').innerHTML=ys.map(y=>`<option>${y}</option>`).join('');if(old&&ys.includes(old))$('year').value=old}function breakdown(a,art,target){let rows=cats.map(c=>[c,a.filter(x=>x.art===art&&x.category===c).reduce((s,x)=>s+x.amount,0)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);$(target).innerHTML=rows.length?rows.map(x=>`<div class="meta" style="display:flex;justify-content:space-between"><span>${esc(x[0])}</span><b>${euro(x[1])}</b></div>`).join(''):'<div class="empty">暂无数据</div>'}function renderStats(){years();let y=$('year').value,m=$('month').value,a=items.filter(x=>(!y||x.date.startsWith(y))&&(!m||x.date.slice(5,7)===m)),c=calc(a);$('sIn').textContent=euro(c.i);$('sOut').textContent=euro(c.o);$('sBal').textContent=euro(c.b);$('sN').textContent=a.length;breakdown(a,'Einnahme','incCats');breakdown(a,'Ausgabe','outCats')}$('year').onchange=renderStats;$('month').onchange=renderStats;
function rows(){return items.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>({Datum:x.date,Art:x.art,Beschreibung:x.desc,'Betrag (€)':x.amount,Kategorie:x.category,Plattform:x.platform,Zahlungsart:x.payment,Beleg:x.receipt,Bankstatus:x.bank,Notiz:x.note}))}function dl(n,c,t){let b=new Blob([c],{type:t}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('csv').onclick=()=>{let h=['Datum','Art','Beschreibung','Betrag (€)','Kategorie','Plattform','Zahlungsart','Beleg','Bankstatus','Notiz'],r=rows().map(o=>h.map(k=>o[k])),csv=[h,...r].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\n');dl(`YuSu_Buchhaltung_${today}.csv`,'\ufeff'+csv,'text/csv;charset=utf-8');toast('CSV 已导出')};$('xlsx').onclick=()=>{if(typeof XLSX==='undefined')return alert('Excel组件没有加载，请保持联网后再试；也可导出CSV，Excel可以直接打开。');let ws=XLSX.utils.json_to_sheet(rows()),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Buchungen');let c=calc(items),cash=items.filter(x=>x.art==='Einnahme'&&x.payment==='Bar'&&x.bank==='noch nicht eingezahlt').reduce((s,x)=>s+x.amount,0),sum=XLSX.utils.aoa_to_sheet([['Yu Su Kreativstudio','Buchhaltung'],['Exportiert am',today],[],['Einnahmen',c.i],['Ausgaben',c.o],['Betriebsergebnis',c.b],['Bar noch nicht eingezahlt',cash]]);XLSX.utils.book_append_sheet(wb,sum,'Übersicht');XLSX.writeFile(wb,`YuSu_Buchhaltung_${today}.xlsx`);toast('Excel 已导出')};$('json').onclick=()=>dl(`YuSu_Backup_${today}.json`,JSON.stringify({version:4,items},null,2),'application/json');$('restore').onclick=()=>{let f=$('imp').files[0];if(!f)return alert('先选择JSON备份文件。');let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result),a=Array.isArray(d)?d:d.items;if(!Array.isArray(a))throw 0;if(confirm(`恢复 ${a.length} 笔记录并替换当前账本？`)){items=a;saveStore();renderAll();toast('已恢复')}}catch(e){alert('无效备份文件')}};r.readAsText(f)};$('wipe').onclick=()=>{if(confirm('建议先备份。确定删除全部数据？')&&confirm('再次确认删除全部？')){items=[];saveStore();renderAll();toast('已清空')}};
function renderAll(){renderHome();renderBook();renderStats()}cats.forEach(c=>{['category','fcat'].forEach(id=>{let o=document.createElement('option');o.value=c;o.textContent=c;$(id).appendChild(o)})});load();reset();renderAll();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
